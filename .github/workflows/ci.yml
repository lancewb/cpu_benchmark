name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Test
        run: go test ./... -coverprofile=coverage.out

      - name: Vet
        run: go vet ./...

  build:
    name: Cross build
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            binary: cpubench
            package: cpubench-linux-amd64
          - goos: linux
            goarch: "386"
            binary: cpubench
            package: cpubench-linux-386
          - goos: linux
            goarch: arm64
            binary: cpubench
            package: cpubench-linux-arm64
          - goos: linux
            goarch: arm
            goarm: "7"
            binary: cpubench
            package: cpubench-linux-armv7
          - goos: linux
            goarch: mipsle
            gomips: softfloat
            binary: cpubench
            package: cpubench-linux-mipsle
          - goos: darwin
            goarch: amd64
            binary: cpubench
            package: cpubench-darwin-amd64
          - goos: darwin
            goarch: arm64
            binary: cpubench
            package: cpubench-darwin-arm64
          - goos: windows
            goarch: amd64
            binary: cpubench.exe
            package: cpubench-windows-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p "dist/${{ matrix.package }}"
          go build -trimpath -ldflags="-s -w" -o "dist/${{ matrix.package }}/${{ matrix.binary }}" ./cmd/cpubench
          cp README.md "dist/${{ matrix.package }}/"
          cp LICENSE "dist/${{ matrix.package }}/" 2>/dev/null || true

      - name: Package
        shell: bash
        run: |
          cd dist
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            zip -r "${{ matrix.package }}.zip" "${{ matrix.package }}"
          else
            tar -czf "${{ matrix.package }}.tar.gz" "${{ matrix.package }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: |
            dist/${{ matrix.package }}.tar.gz
            dist/${{ matrix.package }}.zip
          if-no-files-found: ignore

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > checksums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release/* \
            --title "${{ github.ref_name }}" \
            --notes "Portable cpubench release for Linux, macOS, and Windows."
