name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Test
        run: go test ./... -coverprofile=coverage.out

      - name: Vet
        run: go vet ./...

  build:
    name: Cross build
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            name: cpubench-linux-amd64
          - goos: linux
            goarch: "386"
            name: cpubench-linux-386
          - goos: linux
            goarch: arm64
            name: cpubench-linux-arm64
          - goos: linux
            goarch: arm
            goarm: "7"
            name: cpubench-linux-armv7
          - goos: linux
            goarch: mipsle
            gomips: softfloat
            name: cpubench-linux-mipsle
          - goos: darwin
            goarch: amd64
            name: cpubench-darwin-amd64
          - goos: darwin
            goarch: arm64
            name: cpubench-darwin-arm64
          - goos: windows
            goarch: amd64
            name: cpubench-windows-amd64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/${{ matrix.name }}" ./cmd/cpubench

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}
